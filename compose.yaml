services:
  soundkeep:
    build:
      context: .
    image: dnd-audio-bot:local
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?Set DISCORD_BOT_TOKEN in .env}
      DISCORD_OPUS_BITRATE_MODE: ${DISCORD_OPUS_BITRATE_MODE:-auto}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      BODY_SIZE_LIMIT: 256M
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-262144000}
      MAX_ARTWORK_BYTES: ${MAX_ARTWORK_BYTES:-5242880}
      MAX_LIBRARY_BYTES: ${MAX_LIBRARY_BYTES:-8589934592}
      MIN_FREE_BYTES: ${MIN_FREE_BYTES:-268435456}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-1}
      MAX_PCM_CACHE_BYTES: ${MAX_PCM_CACHE_BYTES:-67108864}
      MAX_PCM_CACHE_ENTRY_BYTES: ${MAX_PCM_CACHE_ENTRY_BYTES:-33554432}
      ACTIVITY_LOG_CAPACITY: ${ACTIVITY_LOG_CAPACITY:-100}
    ports:
      - '3000:3000'
    volumes:
      - soundkeep-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  soundkeep-data:

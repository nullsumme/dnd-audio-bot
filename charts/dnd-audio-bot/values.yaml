replicaCount: 1

image:
  repository: ghcr.io/nullsumme/dnd-audio-bot
  pullPolicy: IfNotPresent
  tag: ''

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

discord:
  existingSecret: dnd-audio-bot
  tokenKey: DISCORD_BOT_TOKEN

ytdlp:
  existingCookiesSecret: ''
  cookiesKey: cookies.txt

audio:
  maxActiveSources: 16
  maxUploadBytes: '262144000'

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts:
    - host: soundkeep.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClass: ''
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 2Gi

livenessProbe:
  httpGet:
    path: /api/health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6

nodeSelector: {}
tolerations: []
affinity: {}

terminationGracePeriodSeconds: 30

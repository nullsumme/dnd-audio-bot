name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run check
      - run: npm run test:run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run helm:lint
      - run: helm template soundkeep charts/dnd-audio-bot --namespace dnd-audio-bot > /tmp/rendered.yaml

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dnd-audio-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
